<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color:#FDF6ED;
            background-image:url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family:'Nunito','Quicksand',sans-serif;
            font-weight:700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:400px;
            margin:50px auto;
            background:rgba(254,251,246,0.9);
            padding:30px;
            border-radius:8px;
            box-shadow:0 4px 12px rgba(200,94,68,0.15);
        }
        h2{text-align:center;color:#5D4037;margin-bottom:25px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;color:#8D6E63;}
        input{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:4px;
            font-family:"微软雅黑",sans-serif;
        }
        button{
            width:100%;
            padding:12px;
            background:#C85E44;
            color:#fff;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-family:"微软雅黑",sans-serif;
        }
        button:hover{background:#A14E3A;}
        .login-link{text-align:center;margin-top:15px;color:#8D6E63;}
        .login-link a{color:#C85E44;text-decoration:none;}
        .footer{text-align:center;padding:20px;color:#8D6E63;margin-top:50px;}
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
        <a href="register.html">注册</a>
    </div>

    <div class="container">
        <h2>用户注册</h2>
        <div class="form-group">
            <label for="phone">手机号码</label>
            <input type="text" id="phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input type="password" id="confirmPassword" placeholder="再次输入密码">
        </div>
        <button onclick="register()">注册</button>
        <div class="login-link">
            已有账号？<a href="login.html">立即登录</a>
        </div>
    </div>

    <div class="footer">
        网页设计答辩作品 · 版权所有
    </div>

    <script>
        function simpleHash(str){
            let hash=0;
            for(let i=0;i<str.length;i++){
                hash=str.charCodeAt(i)+((hash<<5)-hash);
            }
            return hash.toString(16);
        }
        function getUsers(){
            return JSON.parse(localStorage.getItem('GLOBAL_USERS'))||[];
        }
        function saveUsers(us){
            localStorage.setItem('GLOBAL_USERS',JSON.stringify(us));
        }
        function register(){
            let phone=document.getElementById('phone').value.trim();
            let username=document.getElementById('username').value.trim();
            let pwd=document.getElementById('password').value;
            let cpwd=document.getElementById('confirmPassword').value;

            if(!phone||!username||!pwd){
                alert('请填写完整信息');
                return;
            }
            if(pwd!==cpwd){
                alert('两次密码不一致');
                return;
            }
            let users=getUsers();
            if(users.some(u=>u.phone===phone)){
                alert('该手机号已注册');
                return;
            }
            if(users.some(u=>u.username===username)){
                alert('用户名已被使用');
                return;
            }
            users.push({
                userId:Date.now().toString(),
                phone:phone,
                username:username,
                passwordHash:simpleHash(pwd)
            });
            saveUsers(users);
            alert('注册成功！请登录');
            location.href='login.html';
        }
    </script>
</body>
</html>
