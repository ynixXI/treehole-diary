<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的日记 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #FDF6ED;
            background-image: url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:900px;
            margin:40px auto;
            background:rgba(254,251,246,0.95);
            padding:40px;
            border-radius:8px;
        }
        h2{
            text-align:center;
            color:#5D4037;
            margin-bottom:30px;
        }
        .item{
            border-left:4px solid #C85E44;
            padding:15px 20px;
            margin-bottom:15px;
            background:#fff;
            border-radius:6px;
            line-height:1.6;
        }
        .time{
            font-size:14px;
            color:#999;
            margin-bottom:6px;
        }
        .content{
            font-size:16px;
            color:#333;
        }
        .footer{
            text-align:center;
            padding:20px;
            color:#8D6E63;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="diary.html">写日记</a>
        <a href="diary_list.html">日记列表</a>
        <a href="treehole.html">匿名树洞</a>
        <a href="about.html">关于本站</a>
        <span id="userLinks"></span>
    </div>

    <div class="container">
        <h2>📖 我的云端日记</h2>
        <div id="list"></div>
    </div>

    <div class="footer">
        网页设计答辩作品 · 树洞日记网 版权所有
    </div>

<script>
const API = "https://tree-hole-api.onrender.com";
let user = JSON.parse(localStorage.getItem("user") || "null");

async function load() {
    if (!user) { location.href = "login.html"; return; }
    let res = await fetch(API+"/getDiary?uid="+user.id);
    let list = await res.json();
    let html = "";
    list.forEach(i => {
        html += `<div class="item"><div class="time">${i.time}</div><div class="content">${i.content}</div></div>`;
    });
    document.getElementById("list").innerHTML = html;
}

window.onload = function(){
    let user = JSON.parse(localStorage.getItem('user')||'null');
    let userLinks = document.getElementById('userLinks');
    if (user) {
        userLinks.innerHTML = `<a href="profile.html">${user.username}</a> <a href="javascript:void(0)" onclick="logout()">退出</a>`;
    } else {
        userLinks.innerHTML = `<a href="login.html">登录</a> <a href="register.html">注册</a>`;
    }
    load();
};
function logout(){localStorage.removeItem("user");location.href="index.html";}
</script>
</body>
</html>
