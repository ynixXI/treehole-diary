<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #FDF6ED;
            background-image: url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .container{
            width:400px;
            margin:50px auto;
            background:rgba(254,251,246,0.9);
            padding:30px;
            border-radius:8px;
        }
        h2{text-align:center;color:#5D4037;margin-bottom:25px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;color:#8D6E63;}
        input{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;}
        button{
            width:100%;padding:12px;
            background:#C85E44;color:#fff;
            border:none;border-radius:4px;cursor:pointer;
        }
        .footer{text-align:center;padding:20px;color:#8D6E63;margin-top:50px;}
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
        <a href="register.html">注册</a>
    </div>

    <div class="container">
        <h2>用户注册</h2>
        <div class="form-group">
            <label>手机号</label>
            <input id="phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>用户名</label>
            <input id="name" placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input id="pwd" type="password" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input id="cpwd" type="password" placeholder="再次输入密码">
        </div>
        <button onclick="reg()">注册</button>
    </div>

    <div class="footer">树洞日记网 © 版权所有</div>

<script>
function reg() {
    // 强制触发
    console.log("注册按钮点击成功！");

    let phone = document.getElementById("phone").value.trim();
    let name = document.getElementById("name").value.trim();
    let pwd = document.getElementById("pwd").value.trim();
    let cpwd = document.getElementById("cpwd").value.trim();

    if(phone === "" || name === "" || pwd === "" || cpwd === ""){
        alert("请填写完整信息！");
        return;
    }

    if(pwd !== cpwd){
        alert("两次密码不一致！");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users") || "[]");

    // 检查重复
    for(let i=0; i<users.length; i++){
        if(users[i].phone === phone){
            alert("该手机号已注册！");
            return;
        }
        if(users[i].username === name){
            alert("用户名已被占用！");
            return;
        }
    }

    // 注册
    users.push({
        id: Date.now(),
        phone: phone,
        username: name,
        pwd: pwd
    });

    localStorage.setItem("users", JSON.stringify(users));
    alert("注册成功！请登录！");
    location.href = "login.html";
}
</script>
</body>
</html>
