<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人中心 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #FDF6ED;
            background-image: url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:600px;
            margin:50px auto;
            background:rgba(254,251,246,0.95);
            padding:40px;
            border-radius:8px;
            box-shadow:0 4px 12px rgba(200,94,68,0.15);
        }
        h2{
            text-align:center;
            color:#5D4037;
            margin-bottom:30px;
        }
        .info{
            font-size:16px;
            line-height:2;
            margin-bottom:30px;
            color:#333;
        }
        input{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:4px;
            margin-bottom:15px;
        }
        button{
            background:#C85E44;
            color:#fff;
            border:none;
            padding:10px 20px;
            border-radius:4px;
            cursor:pointer;
        }
        .footer{
            text-align:center;
            padding:20px;
            color:#8D6E63;
            margin-top:30px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="diary.html">写日记</a>
        <a href="diary_list.html">日记列表</a>
        <a href="treehole.html">匿名树洞</a>
        <a href="about.html">关于本站</a>
        <span id="userLinks"></span>
    </div>

    <div class="container">
        <h2>👤 个人中心</h2>
        <div class="info" id="info"></div>

        <input id="newName" placeholder="输入新用户名">
        <button onclick="updateName()">修改用户名（全局同步）</button>
    </div>

    <div class="footer">
        网页设计答辩作品 · 树洞日记网 版权所有
    </div>

<script>
const API = "https://tree-hole-api.onrender.com";
let user = JSON.parse(localStorage.getItem("user") || "null");

window.onload = function () {
    if (!user) { location.href = "login.html"; return; }
    document.getElementById("info").innerHTML = `
        用户名：${user.username}<br>
        手机号：${user.phone}<br>
        用户ID：${user.id}
    `;
    
    let s = document.getElementById("userLinks");
    s.innerHTML = `<a href="profile.html">${user.username}</a> <a href="javascript:void(0)" onclick="logout()">退出</a>`;
};
function logout(){localStorage.removeItem("user");location.href="index.html";}

async function updateName() {
    let newName = document.getElementById("newName").value.trim();
    if (!newName) return alert("请输入新用户名");
    
    let res = await fetch(API+"/rename?uid="+user.id+"&name="+encodeURIComponent(newName));
    let ok = await res.json();
    
    if(ok){
        user.username = newName;
        localStorage.setItem("user", JSON.stringify(user));
        alert("修改成功！全局已同步");
        location.reload();
    }else{
        alert("用户名已被占用");
    }
}
</script>
</body>
</html>
