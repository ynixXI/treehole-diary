<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日记列表 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #E0E0E0;
            background-image: url('https://aka.doubaocdn.com/s/RDj01wVYDu');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#3A5F56;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:900px;
            margin:40px auto;
            background: rgba(240, 240, 240, 0.85);
            padding:30px;
            border-radius:8px;
            box-shadow:0 0 8px rgba(0, 0, 0, 0.15);
        }
        h2{text-align:center;color:#333333;margin-bottom:25px;}
        .diary-list{margin-top:20px;}
        .diary-item{
            border-bottom:1px solid #ccc;
            padding:15px 0;
            color:#555555;
            margin-bottom: 15px;
        }
        .diary-date { font-weight: bold; color: #333333; margin-bottom: 5px; }
        .diary-content { line-height: 1.6; }
        .delete-btn {
            float: right; background: #ef4444; color: white; border: none;
            padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .empty-tip { text-align: center; color: #888; padding: 20px; }
        .footer{text-align:center;padding:20px;color:#555555;margin-top:50px;}
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="diary.html">写日记</a>
        <a href="diary_list.html">日记列表</a>
        <a href="treehole.html">匿名树洞</a>
        <a href="about.html">关于本站</a>
        <span id="userLinks"></span>
    </div>

    <div class="container">
        <h2>我的日记列表</h2>
        <div class="diary-list" id="diaryList"></div>
    </div>

    <div class="footer">网页设计答辩作品 · 树洞日记网 版权所有</div>

    <script>
        window.onload = function() {
            updateUserLinks();
            if (!checkLoginStatus()) redirectToLogin();
            else loadDiaries();
        };

        function checkLoginStatus() { return !!localStorage.getItem('currentUser'); }
        function redirectToLogin() { alert('请先登录！'); location.href = 'login.html'; }

        function updateUserLinks() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const el = document.getElementById('userLinks');
            if (user) {
                el.innerHTML = `
                    <a href="profile.html">个人中心 (${user.username})</a>
                    <a href="javascript:void(0)" onclick="logout()">退出</a>
                `;
            } else {
                el.innerHTML = `<a href="login.html">登录</a> <a href="register.html">注册</a>`;
            }
        }

        function logout() {
            if (confirm('确定退出？')) {
                localStorage.removeItem('currentUser');
                location.href = 'index.html';
            }
        }

        function loadDiaries() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const key = user.userId + '_diaries';
            const diaries = JSON.parse(localStorage.getItem(key)) || [];
            const container = document.getElementById('diaryList');

            if (diaries.length === 0) {
                container.innerHTML = '<p class="empty-tip">暂无日记</p>';
                return;
            }

            const reversed = [...diaries].reverse();
            let html = '';
            reversed.forEach((d, i) => {
                const idx = diaries.length - 1 - i;
                html += `
                <div class="diary-item">
                    <div class="diary-date">${d.date}</div>
                    <div class="diary-content">${d.content}</div>
                    <button class="delete-btn" onclick="del(${idx})">删除</button>
                </div>`;
            });
            container.innerHTML = html;
        }

        function del(idx) {
            if (!confirm('确定删除？')) return;
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const key = user.userId + '_diaries';
            const list = JSON.parse(localStorage.getItem(key)) || [];
            list.splice(idx, 1);
            localStorage.setItem(key, JSON.stringify(list));
            loadDiaries();
        }
    </script>
</body>
</html>
