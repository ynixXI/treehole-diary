<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>写日记 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #FDF6ED;
            background-image: url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:900px;
            margin:40px auto;
            background:rgba(254,251,246,0.95);
            padding:40px;
            border-radius:8px;
            box-shadow:0 4px 12px rgba(200,94,68,0.1);
        }
        h2{
            text-align:center;
            color:#5D4037;
            margin-bottom:30px;
            font-size:24px;
        }
        textarea{
            width:100%;
            height:260px;
            padding:15px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:16px;
            font-family:"微软雅黑",sans-serif;
            resize:none;
            margin-bottom:20px;
        }
        button{
            background:#C85E44;
            color:#fff;
            border:none;
            padding:12px 30px;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{
            background:#a14b37;
        }
        .footer{
            text-align:center;
            padding:20px;
            color:#8D6E63;
            margin-top:30px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="diary.html">写日记</a>
        <a href="diary_list.html">日记列表</a>
        <a href="treehole.html">匿名树洞</a>
        <a href="about.html">关于本站</a>
        <span id="userLinks"></span>
    </div>

    <div class="container">
        <h2>✍️ 撰写个人日记</h2>
        <textarea id="content" placeholder="请写下今天的心情、故事或感悟……只有你自己能查看哦"></textarea>
        <button onclick="saveDiary()">保存日记</button>
    </div>

    <div class="footer">
        网页设计答辩作品 · 树洞日记网 版权所有
    </div>

<script>
const API = "https://tree-hole-api.onrender.com";
let user = JSON.parse(localStorage.getItem("user") || "null");

window.onload = function () {
    if (!user) { 
        alert("请先登录！"); 
        location.href = "login.html"; 
        return; 
    }
    let s = document.getElementById("userLinks");
    s.innerHTML = `<a href="profile.html">${user.username}</a> <a href="javascript:void(0)" onclick="logout()">退出</a>`;
};

function logout() { 
    localStorage.removeItem("user"); 
    location.href = "index.html"; 
}

// 修复日记保存功能，增加本地备份和错误处理
async function saveDiary() {
    let content = document.getElementById("content").value.trim();
    if (!content) {
        alert("请输入日记内容！");
        return;
    }

    try {
        // 方案1：优先使用API保存到云端
        const response = await fetch(`${API}/addDiary`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                uid: user.id,
                content: content,
                time: new Date().toLocaleString()
            })
        });

        // 方案2：API不可用时，本地localStorage备份
        if (!response.ok) {
            throw new Error('云端保存失败，将使用本地存储');
        }

        // 本地备份日记数据（双保险）
        let localDiaries = JSON.parse(localStorage.getItem(`diaries_${user.id}`) || "[]");
        localDiaries.unshift({
            id: Date.now(),
            content: content,
            time: new Date().toLocaleString()
        });
        localStorage.setItem(`diaries_${user.id}`, JSON.stringify(localDiaries));

        alert("保存成功！日记已安全存储");
        document.getElementById("content").value = "";
        
    } catch (error) {
        console.error("保存失败:", error);
        // 降级到纯本地存储
        let localDiaries = JSON.parse(localStorage.getItem(`diaries_${user.id}`) || "[]");
        localDiaries.unshift({
            id: Date.now(),
            content: content,
            time: new Date().toLocaleString()
        });
        localStorage.setItem(`diaries_${user.id}`, JSON.stringify(localDiaries));
        alert("云端保存暂时失败，已为你本地保存日记！");
        document.getElementById("content").value = "";
    }
}
</script>
</body>
</html>
