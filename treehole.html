<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>匿名树洞 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #F0FFF4;
            background-image: url('https://aka.doubaocdn.com/s/hhiL1wVYM5');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#6EE7B7;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:900px;
            margin:40px auto;
            background:rgba(255,255,255,0.92);
            padding:40px;
            border-radius:8px;
        }
        h2{
            text-align:center;
            color:#374151;
            margin-bottom:25px;
        }
        textarea{
            width:100%;
            height:140px;
            padding:15px;
            border:1px solid #D1FAE5;
            border-radius:6px;
            font-size:16px;
            margin-bottom:20px;
            font-family:"微软雅黑",sans-serif;
        }
        button{
            background:#6EE7B7;
            color:#fff;
            border:none;
            padding:12px 30px;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }
        .post{
            border:1px solid #D1FAE5;
            padding:20px;
            border-radius:8px;
            margin-bottom:15px;
        }
        .meta{
            font-size:13px;
            color:#6B7280;
            margin-bottom:8px;
        }
        .content{
            font-size:16px;
            line-height:1.6;
            margin-bottom:12px;
        }
        .like{
            background:none;
            border:none;
            color:#EF4444;
            cursor:pointer;
            font-size:15px;
        }
        .del{
            background:#EF4444;
            color:#fff;
            border:none;
            padding:4px 10px;
            border-radius:4px;
            font-size:12px;
            margin-left:10px;
            cursor:pointer;
        }
        .footer{
            text-align:center;
            padding:20px;
            color:#4B5563;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="diary.html">写日记</a>
        <a href="diary_list.html">日记列表</a>
        <a href="treehole.html">匿名树洞</a>
        <a href="about.html">关于本站</a>
        <span id="userLinks"></span>
    </div>

    <div class="container">
        <h2>💬 全球匿名树洞</h2>
        <textarea id="content" placeholder="分享你的心事，全球用户都能看到～"></textarea>
        <button onclick="send()">发布帖子</button>
        <div id="list" style="margin-top:30px;"></div>
    </div>

    <div class="footer">
        网页设计答辩作品 · 树洞日记网 版权所有
    </div>

<script>
const API = "https://tree-hole-api.onrender.com";

// 修复登录状态读取 BUG
let user = null;
try {
    user = JSON.parse(localStorage.getItem("user"));
} catch (e) {
    user = null;
}

window.onload = async function () {
    render();
    let s = document.getElementById("userLinks");
    if (user && user.id) {
        s.innerHTML = `<a href="profile.html">${user.username}</a> <a href="javascript:void(0)" onclick="logout()">退出</a>`;
    } else {
        s.innerHTML = `<a href="login.html">登录</a> <a href="register.html">注册</a>`;
    }
};
function logout() { localStorage.removeItem("user"); location.href = "index.html"; }

// 修复发帖判断登录 BUG
async function send() {
    if (!user || !user.id) {
        alert("您还未登录，请先登录！");
        location.href = "login.html";
        return;
    }
    let c = document.getElementById("content").value.trim();
    if (!c) return;
    await fetch(API+"/addPost?uid="+user.id+"&content="+encodeURIComponent(c));
    document.getElementById("content").value = "";
    render();
}

async function render() {
    let res = await fetch(API+"/getPosts");
    let posts = await res.json();
    let html = "";
    posts.forEach(p => {
        let isMine = user && user.id === p.uid;
        html += `
        <div class="post">
            <div class="meta">${p.time}</div>
            <div class="content">${p.content}</div>
            <button class="like" onclick="like('${p.id}')">❤️ ${p.like}</button>
            ${isMine ? `<button class="del" onclick="del('${p.id}')">删除</button>` : ""}
        </div>`;
    });
    document.getElementById("list").innerHTML = html;
}

async function like(id) {
    await fetch(API+"/like?id="+id);
    render();
}

async function del(id) {
    await fetch(API+"/del?id="+id+"&uid="+user.id);
    render();
}
</script>
</body>
</html>
