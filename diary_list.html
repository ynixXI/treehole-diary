<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的日记 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #FDF6ED;
            background-image: url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunuto', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:900px;
            margin:40px auto;
            background:rgba(254,251,246,0.95);
            padding:40px;
            border-radius:8px;
        }
        h2{
            text-align:center;
            color:#5D4037;
            margin-bottom:30px;
        }
        .item{
            border-left:4px solid #C85E44;
            padding:15px 20px;
            margin-bottom:15px;
            background:#fff;
            border-radius:6px;
            line-height:1.6;
        }
        .time{
            font-size:14px;
            color:#999;
            margin-bottom:6px;
        }
        .content{
            font-size:16px;
            color:#333;
        }
        .footer{
            text-align:center;
            padding:20px;
            color:#8D6E63;
        }
        .tip{
            text-align:center;
            color:#C85E44;
            margin:20px 0;
            font-size:16px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="diary.html">写日记</a>
        <a href="diary_list.html">日记列表</a>
        <a href="treehole.html">匿名树洞</a>
        <a href="about.html">关于本站</a>
        <span id="userLinks"></span>
    </div>

    <div class="container">
        <h2>📖 我的云端日记</h2>
        <div id="tip" class="tip"></div>
        <div id="list"></div>
    </div>

    <div class="footer">
        网页设计答辩作品 · 树洞日记网 版权所有
    </div>

<script>
const API = "https://tree-hole-api.onrender.com";
let user = JSON.parse(localStorage.getItem("user") || "null");

// 加载日记：优先云端，失败则加载本地备份
async function load() {
    // 【修复 1】解决作用域冲突，使用全局的 user
    if (!user) { 
        location.href = "login.html"; 
        return; 
    }

    let diaryList = [];
    let tipDom = document.getElementById("tip");
    tipDom.innerHTML = "";

    try {
        // 1. 优先请求云端API
        const response = await fetch(`${API}/getDiary?uid=${user.id}`);
        if (response.ok) {
            diaryList = await response.json();
            // 云端有数据时，同步到本地（保持数据一致）
            if (diaryList.length > 0) {
                localStorage.setItem(`diaries_${user.id}`, JSON.stringify(diaryList));
            }
        } else {
            throw new Error("云端数据获取失败");
        }
    } catch (error) {
        // 2. API失败时，加载本地备份
        console.error("云端加载失败，使用本地备份:", error);
        tipDom.innerHTML = "⚠️ 云端暂时不可用，显示本地备份日记";
    }

    // 【修复 2】无论成功失败，最后都强制读取本地日记（解决 GitHub 不显示）
    let localDiaries = JSON.parse(localStorage.getItem(`diaries_${user.id}`) || "[]");
    
    // 【修复 3】优先使用本地数据，保证一定能显示
    if (localDiaries.length > 0) {
        diaryList = localDiaries;
        tipDom.innerHTML = "⚠️ 云端暂时不可用，显示本地备份日记";
    }

    // 渲染日记列表
    renderDiaryList(diaryList);
}

// 渲染日记列表（抽离成独立函数，便于复用）
function renderDiaryList(list) {
    let html = "";
    if (list.length === 0) {
        html = "<div style='text-align:center; color:#999; padding:20px;'>暂无日记内容，快去写点什么吧～</div>";
    } else {
        list.forEach(i => {
            html += `<div class="item"><div class="time">${i.time}</div><div class="content">${i.content}</div></div>`;
        });
    }
    document.getElementById("list").innerHTML = html;
}

window.onload = function(){
    // 【修复 4】不重复覆盖 user，直接用全局
    let userLinks = document.getElementById('userLinks');
    if (user) {
        userLinks.innerHTML = `<a href="profile.html">${user.username}</a> <a href="javascript:void(0)" onclick="logout()">退出</a>`;
    } else {
        userLinks.innerHTML = `<a href="login.html">登录</a> <a href="register.html">注册</a>`;
    }
    load();
};

function logout(){
    localStorage.removeItem("user");
    location.href="index.html";
}
</script>
</body>
</html>
