<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #FDF6ED;
            background-image: url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .nav a:hover{text-decoration:underline;}
        .container{
            width:400px;
            margin:50px auto;
            background:rgba(254,251,246,0.9);
            padding:30px;
            border-radius:8px;
            box-shadow:0 4px 12px rgba(200,94,68,0.15);
        }
        h2{text-align:center;color:#5D4037;margin-bottom:25px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;color:#8D6E63;}
        input{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:4px;
            font-family:"微软雅黑",sans-serif;
        }
        button{
            width:100%;
            padding:12px;
            background:#C85E44;
            color:#fff;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-family:"微软雅黑",sans-serif;
        }
        button:hover{background:#A14E3A;}
        .register-link,.forgot-link{
            text-align:center;margin-top:10px;color:#8D6E63;
        }
        .register-link a,.forgot-link a{
            color:#C85E44;text-decoration:none;
        }
        .footer{text-align:center;padding:20px;color:#8D6E63;margin-top:50px;}
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
        <a href="register.html">注册</a>
    </div>

    <div class="container">
        <h2>用户登录</h2>
        <div class="form-group">
            <label for="account">用户名/手机号</label>
            <input type="text" id="account" placeholder="请输入用户名或手机号">
        </div>
        <div class="form-group">
            <label for="pwd">密码</label>
            <input type="password" id="pwd" placeholder="请输入密码">
        </div>
        <button onclick="login()">登录</button>
        <div class="forgot-link">
            <a href="forgot.html">忘记密码？</a>
        </div>
        <div class="register-link">
            还没有账号？<a href="register.html">立即注册</a>
        </div>
    </div>

    <div class="footer">
        网页设计答辩作品 · 树洞日记网 版权所有
    </div>

<script>
function login() {
    // 强制触发，一定执行！
    console.log("登录按钮点击成功！");

    let account = document.getElementById("account").value.trim();
    let pwd = document.getElementById("pwd").value.trim();

    if(account === "" || pwd === ""){
        alert("请填写完整信息！");
        return;
    }

    // 读取用户
    let users = JSON.parse(localStorage.getItem("users") || "[]");

    for(let i=0; i<users.length; i++){
        let u = users[i];
        if( (u.username === account || u.phone === account) && u.pwd === pwd ){
            localStorage.setItem("user", JSON.stringify(u));
            alert("登录成功！");
            location.href = "index.html";
            return;
        }
    }

    alert("账号或密码错误！");
}
</script>
</body>
</html>
