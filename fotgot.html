<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>找回密码 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"微软雅黑",sans-serif;
            background-color: #FDF6ED;
            background-image: url('https://aka.doubaocdn.com/s/UUmX1wVY5S');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .nav{
            background:#C85E44;
            padding:18px;text-align:center;
        }
        .nav a{
            color:#fff;
            text-decoration:none;
            font-size:18px;
            margin:0 20px;
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .container{
            width:400px;
            margin:50px auto;
            background:rgba(254,251,246,0.95);
            padding:30px;
            border-radius:8px;
        }
        h2{
            text-align:center;
            color:#5D4037;
            margin-bottom:25px;
        }
        .form-group{
            margin-bottom:20px;
        }
        label{
            display:block;margin-bottom:8px;color:#8D6E63;
        }
        input{
            width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;
        }
        button{
            width:100%;
            background:#C85E44;
            color:#fff;
            border:none;
            padding:12px;
            border-radius:4px;
            cursor:pointer;
        }
        .footer{
            text-align:center;padding:20px;color:#8D6E63;margin-top:30px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
    </div>

    <div class="container">
        <h2>🔑 找回密码</h2>
        <div class="form-group">
            <label>已注册手机号</label>
            <input id="phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>新密码</label>
            <input id="newPwd" type="password" placeholder="请输入新密码">
        </div>
        <button onclick="resetPwd()">重置密码</button>
    </div>

    <div class="footer">
        网页设计答辩作品 · 树洞日记网 版权所有
    </div>

<script>
const API = "https://tree-hole-api.onrender.com";

async function resetPwd() {
    let phone = document.getElementById("phone").value.trim();
    let newPwd = document.getElementById("newPwd").value.trim();
    if (!phone || !newPwd) return alert("请填写完整");
    
    let res = await fetch(API+"/reset?phone="+encodeURIComponent(phone)+"&pwd="+encodeURIComponent(newPwd));
    let ok = await res.json();
    
    if (ok) {
        alert("密码重置成功！请登录");
        location.href = "login.html";
    } else {
        alert("手机号未注册");
    }
}
</script>
</body>
</html>
