<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>找回密码 - 树洞日记网</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"微软雅黑",sans-serif;background:#FDF6ED;background-image:url('https://aka.doubaocdn.com/s/UUmX1wVY5S');background-size:cover;background-position:center;background-attachment:fixed;}
        .nav{background:#C85E44;padding:18px;text-align:center;}
        .nav a{color:#fff;text-decoration:none;font-size:18px;margin:0 20px;font-weight:700;}
        .container{width:400px;margin:50px auto;background:rgba(254,251,246,0.9);padding:30px;border-radius:8px;}
        h2{text-align:center;color:#5D4037;margin-bottom:25px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;color:#8D6E63;}
        input{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;}
        button{width:100%;padding:12px;background:#C85E44;color:#fff;border:none;border-radius:4px;cursor:pointer;}
        .footer{text-align:center;padding:20px;color:#8D6E63;margin-top:50px;}
        .code{display:flex;gap:10px;}
        .code button{width:120px;}
    </style>
</head>
<body>
    <div class="nav"><a href="index.html">首页</a><a href="login.html">登录</a></div>
    <div class="container">
        <h2>找回密码</h2>
        <div class="form-group">
            <label>手机号</label><input id="phone" type="text" placeholder="输入注册手机号">
        </div>
        <div class="form-group code">
            <input id="code" placeholder="验证码">
            <button onclick="getCode()">获取</button>
        </div>
        <div class="form-group">
            <label>新密码</label><input id="newPwd" type="password" placeholder="输入新密码">
        </div>
        <button onclick="resetPwd()">重置密码</button>
    </div>
    <div class="footer">树洞日记网 © 版权所有</div>

    <script>
        function getUsers(){return JSON.parse(localStorage.getItem('GLOBAL_USERS'))||[];}
        function saveUsers(us){localStorage.setItem('GLOBAL_USERS',JSON.stringify(us));}
        function simpleHash(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return h.toString(16);}
        
        let code='';
        function getCode(){
            const phone=document.getElementById('phone').value.trim();
            if(!getUsers().some(u=>u.phone===phone)){alert('手机号未注册');return;}
            code='123456';
            alert('验证码：123456（演示版）');
        }

        function resetPwd(){
            const phone=document.getElementById('phone').value.trim();
            const c=document.getElementById('code').value.trim();
            const pwd=document.getElementById('newPwd').value.trim();
            if(!phone||!c||!pwd){alert('请填写完整');return;}
            if(c!==code){alert('验证码错误');return;}
            const users=getUsers();
            const user=users.find(u=>u.phone===phone);
            user.passwordHash=simpleHash(pwd);
            saveUsers(users);
            alert('重置成功！请登录');
            location.href='login.html';
        }
    </script>
</body>
</html>
